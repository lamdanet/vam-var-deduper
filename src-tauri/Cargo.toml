[package]
name = "vam_var_deduper_tauri"
version = "0.1.1"
edition = "2021"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/lamdanet/vam-var-deduper"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
aes = "0.9"
anyhow = "1"
base64 = "0.23"
encoding_rs = "0.8"
regex = "1"
# native-tls-no-alpn = the OS TLS stack (SChannel on Windows), matching the C#
# tool's HttpClient and curl. rustls was getting filtered by the Hub's Cloudflare.
# Not "default-tls": since reqwest 0.13 that means rustls. And not "native-tls":
# that adds ALPN, which changes the handshake 0.12's default-tls sent.
# "stream" + tokio/futures-util power the async download path (per-chunk idle
# timeout for stall detection; blocking client lacks a read timeout).
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "native-tls-no-alpn", "stream"] }
tokio = { version = "1", features = ["rt", "time"] }
futures-util = "0.3"
rfd = "0.15"
rayon = "1.10"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# "unstable": child webviews (Window::add_child) for the Hub page browser.
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-dialog = "2"
# Recycle Bin for whole-.var removals on the VAR Packages page. Never a
# permanent delete: a failed recycle must stay failed, not fall back to unlink.
trash = "5"
walkdir = "2"
# aes-crypto: AES-encrypted zips (7-Zip's "AES-256"), shared as download sources.
zip = { version = "8", default-features = false, features = ["deflate", "deflate64", "aes-crypto"] }

# GetDriveTypeW, to refuse recycling on volumes that have no Recycle Bin (exFAT/
# FAT32 removables, NukeOnDelete) — there `trash::delete` permanently deletes and
# still returns Ok. Already in the tree via tao/tauri-runtime-wry, so this pulls
# in no new compile.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[profile.dev]
incremental = true

[profile.release]
lto = true
codegen-units = 1
strip = true
