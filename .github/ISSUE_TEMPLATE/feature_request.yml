name: Feature request
description: Suggest something new or a change to how the app works
labels: ["enhancement", "triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The problem or the task, not the solution yet. For example, "I can't tell which packages are only used by one scene".
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: What would help?
      description: How you imagine it working in the app.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: What do you do today instead?
      description: Workarounds or other tools you use for this now.

  - type: dropdown
    id: contribute
    attributes:
      label: Would you like to work on this?
      options:
        - "No"
        - "Yes, I'd open a pull request"
