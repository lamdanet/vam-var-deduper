# Builds the Windows app and publishes it as a GitHub Release.
#
# Two ways to start it (see docs/RELEASING.md):
#   - push a tag like v0.2.0
#   - Actions tab -> Release -> Run workflow (on main); it tags the commit itself
#
# The version must match src-tauri/Cargo.toml (the app's only version; Tauri
# reads it from there), so a release can't go out labelled with a version the
# app doesn't report.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 0.2.0 (empty = the version in src-tauri/Cargo.toml)"
        required: false
        default: ""
      prerelease:
        description: "Mark as a pre-release"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - name: Work out the version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          cargo_version=$(sed -n 's/^version = "\(.*\)"/\1/p' src-tauri/Cargo.toml | head -1)

          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            if [ "$GITHUB_REF_NAME" != "main" ]; then
              echo "::error::Run releases from main (this run is on $GITHUB_REF_NAME)."
              exit 1
            fi
            version="${INPUT_VERSION#v}"
            version="${version:-$cargo_version}"
            if gh release view "v$version" >/dev/null 2>&1 || git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
              echo "::error::v$version is already released or tagged. Bump the version first (docs/RELEASING.md)."
              exit 1
            fi
          fi

          if [ "$version" != "$cargo_version" ]; then
            echo "::error::Release version $version doesn't match src-tauri/Cargo.toml ($cargo_version). Bump it first (docs/RELEASING.md)."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build
        run: cargo build --release --locked --manifest-path src-tauri/Cargo.toml

      - name: Package
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $name = "VAM-VAR-Deduper-v$env:VERSION-windows-x64"
          New-Item -ItemType Directory -Force "dist/$name" | Out-Null
          Copy-Item src-tauri/target/release/vam_var_deduper_tauri.exe "dist/$name/VAM-VAR-Deduper.exe"
          Compress-Archive -Path "dist/$name/*" -DestinationPath "dist/$name.zip"
          Copy-Item "dist/$name/VAM-VAR-Deduper.exe" "dist/$name.exe"
          Get-FileHash "dist/$name.zip", "dist/$name.exe" -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } |
            Set-Content -Encoding ascii "dist/SHA256SUMS.txt"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          flags=()
          [ "$PRERELEASE" = "true" ] && flags+=(--prerelease)
          gh release create "v$VERSION" dist/*.zip dist/*.exe dist/SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title "VAM VAR Deduper v$VERSION" \
            --generate-notes \
            "${flags[@]}"
